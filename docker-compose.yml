# Локальное окружение: PostgreSQL, RabbitMQ, процессы приложения и web (nginx с двумя PWA).
x-app: &app
  build: .
  env_file: .env
  depends_on:
    postgres:
      condition: service_healthy
    rabbitmq:
      condition: service_healthy
    migrate:
      condition: service_completed_successfully
  restart: unless-stopped

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: beauty
      POSTGRES_PASSWORD: beauty
      POSTGRES_DB: beauty
    ports: ["5432:5432"]
    volumes: ["pgdata:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U beauty"]
      interval: 3s
      retries: 20

  rabbitmq:
    image: rabbitmq:4-management
    ports: ["5672:5672", "15672:15672"]
    volumes: ["rabbitdata:/var/lib/rabbitmq"]
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "check_running"]
      interval: 5s
      retries: 30

  migrate:
    build: .
    env_file: .env
    entrypoint: ["alembic", "upgrade", "head"]
    depends_on:
      postgres:
        condition: service_healthy

  # Демо-мастер alisa (идемпотентно): страница http://alisa.localhost:8080 работает сразу.
  seed:
    <<: *app
    command: ["seed-demo"]
    restart: "no"

  api:
    <<: *app
    command: ["api"]
    ports: ["8000:8000"]
    volumes: ["files:/app/var/files"]

  bot:
    <<: *app
    command: ["bot"]

  relay:
    <<: *app
    command: ["relay"]

  scheduler:
    <<: *app
    command: ["scheduler"]

  # Консьюмеры событий: администратор записи и карточки заявок в переписке.
  worker:
    <<: *app
    command: ["worker"]

  # PWA клиента (http://<slug>.localhost:8080) и мастера (http://master.localhost:8080).
  web:
    build:
      context: ./frontend
      args:
        VITE_VAPID_PUBLIC_KEY: ${VITE_VAPID_PUBLIC_KEY:-}
    ports: ["8080:80"]
    depends_on: [api]
    restart: unless-stopped

volumes:
  pgdata:
  rabbitdata:
  files:
