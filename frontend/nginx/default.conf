# Раздача по host: admin.* — панель хозяина, master.* — кабинет мастера, <slug>.* — страница мастера.
# /api проксируется на сервис api (FastAPI) того же compose.

resolver 127.0.0.11 valid=10s ipv6=off;

gzip on;
gzip_types text/css application/javascript application/json application/manifest+json image/svg+xml;
gzip_min_length 1024;

server {
    listen 80;
    server_name master.beautiful.kz master.localhost ~^master\.[0-9.-]+\.nip\.io$;
    root /usr/share/nginx/master;
    include /etc/nginx/snippets/app.conf;
}

# Админ-панель хозяина сервиса: admin.* (не индексируется).
server {
    listen 80;
    server_name admin.beautiful.kz admin.localhost ~^admin\.[0-9.-]+\.nip\.io$;
    root /usr/share/nginx/admin;
    add_header X-Robots-Tag "noindex, nofollow" always;
    include /etc/nginx/snippets/app.conf;
}

server {
    listen 80 default_server;
    server_name ~^[a-z0-9-]+\.beautiful\.kz$ ~^[a-z0-9-]+\.localhost$;
    root /usr/share/nginx/client;
    include /etc/nginx/snippets/app.conf;
}
