# Общие правила SPA + прокси API.

location /api/ {
    # Переменная + resolver: nginx стартует, даже если api ещё не поднялся.
    set $api_upstream http://api:8000;
    proxy_pass $api_upstream;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Connection "";
    # SSE: без буферизации и с запасом по времени (поток входа живёт ~330 с).
    proxy_buffering off;
    proxy_cache off;
    proxy_read_timeout 360s;
    # Голосовые — до 5 МБ, фото работ и аватар — до 8 МБ.
    client_max_body_size 10m;
}

# Service worker и манифест не кэшируются — обновления PWA доходят сразу.
location = /sw.js {
    include /etc/nginx/snippets/security-headers.conf;
    add_header Cache-Control "no-cache";
    try_files $uri =404;
}

location = /manifest.webmanifest {
    default_type application/manifest+json;
    include /etc/nginx/snippets/security-headers.conf;
    add_header Cache-Control "no-cache";
    try_files $uri =404;
}

location /assets/ {
    include /etc/nginx/snippets/security-headers.conf;
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
}

location / {
    include /etc/nginx/snippets/security-headers.conf;
    add_header Cache-Control "no-cache";
    try_files $uri $uri/ /index.html;
}
