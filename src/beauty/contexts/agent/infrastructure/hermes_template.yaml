# Дополнения к config.yaml профиля-шаблона ресепшна beauty-template (вливаются командой
# `beauty agent bootstrap`). Профили ресепшна мастеров клонируются из шаблона.

# Агент, с которым пишут клиенты, получает только наш MCP. Без shell, файлов и браузера —
# и без памяти и поиска по сессиям: они общие для всех клиентов профиля, а значит канал
# утечки данных одного клиента другому. Контекст диалога держит сессия Hermes.
platform_toolsets:
  api_server:
    - mcp-beauty

# Второй рубеж: эти тулсеты выключены совсем, даже если платформа сменится.
agent:
  disabled_toolsets:
    - memory
    - session_search
    - terminal
    - file
    - browser
    - code_execution
    - delegation
    - cronjob
    - computer_use
    - kanban
    - catalog
    - connections
    - web

# Инструменты MCP — прямо в списке инструментов модели, без моста tool_search/tool_describe/
# tool_call: каждый шаг моста — лишний вызов LLM на ход (итоги спайка: латентность хода).
tools:
  tool_search:
    enabled: "off"

mcp_servers:
  beauty:
    # ${VAR} подставляются из .env ИМЕННО этого профиля (у каждого мастера свой токен).
    url: "${BEAUTY_MCP_URL}"
    headers:
      Authorization: "Bearer ${BEAUTY_MCP_TOKEN}"
    # Hermes подставит имя профиля — MCP сверит его с токеном.
    identity_header:
      name: "X-Hermes-Profile"
      value_from: "profile"
    timeout: 30
    connect_timeout: 15
    tools:
      prompts: false
      resources: false
    sampling:
      enabled: false
